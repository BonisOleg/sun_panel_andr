{% spaceless %}
{% if seo_robots %}
<meta name="robots" content="{{ seo_robots }}">
{% endif %}
{% if seo_description %}
<meta name="description" content="{{ seo_description }}">
{% endif %}
{% if seo_keywords %}
<meta name="keywords" content="{{ seo_keywords }}">
{% endif %}
<link rel="canonical" href="{{ seo_canonical }}">
<meta property="og:locale" content="uk_UA">
<meta property="og:type" content="{{ seo_og_type|default:'website' }}">
<meta property="og:site_name" content="{{ site_settings.site_name|default:'Soliron' }}">
<meta property="og:title" content="{{ seo_og_title|default:seo_title }}">
{% if seo_description %}
<meta property="og:description" content="{{ seo_description }}">
{% endif %}
<meta property="og:url" content="{{ seo_canonical }}">
{% if seo_og_image %}
<meta property="og:image" content="{% if seo_og_image|slice:':4' == 'http' %}{{ seo_og_image }}{% else %}{{ public_base_url }}{{ seo_og_image }}{% endif %}">
{% endif %}
<meta name="twitter:card" content="{% if seo_og_image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ seo_og_title|default:seo_title }}">
{% if seo_description %}
<meta name="twitter:description" content="{{ seo_description }}">
{% endif %}
{% if seo_og_image %}
<meta name="twitter:image" content="{% if seo_og_image|slice:':4' == 'http' %}{{ seo_og_image }}{% else %}{{ public_base_url }}{{ seo_og_image }}{% endif %}">
{% endif %}
{% endspaceless %}
