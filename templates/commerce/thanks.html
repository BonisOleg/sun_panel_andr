{% extends "base.html" %}
{% block title %}Дякуємо — {{ site_settings.site_name|default:"Soliron" }}{% endblock %}
{% block content %}
<div class="container section">
  <section class="surface thanks-card">
    <h1>Дякуємо за замовлення</h1>
    <p>Номер замовлення: <strong>{{ order_number }}</strong></p>
    <p>Ми отримали ваші дані. Менеджер звʼяжеться з вами.</p>
    <a class="btn" href="{% url 'catalog:list' %}">Продовжити покупки</a>
  </section>
</div>
{% endblock %}
