{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ seo_title|default:site_settings.site_name|default:"Soliron" }}{% endblock %}</title>
  {% block seo_meta %}{% include "partials/seo_meta.html" %}{% endblock %}
  <meta name="theme-color" content="#6c5685">
  <link rel="icon" href="{% static 'images/favicon/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% url 'seo:webmanifest' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  {# Direct links (not @import) so every file gets ?v= — otherwise imported CSS stays stale #}
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/reset.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/components/custom-dropdown.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/components/richtext.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/components/header_search.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/components/footer.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/home.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/home-advantages.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/shop.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/blog.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/product-detail.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/product-detail-2.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/categories-home.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/categories-home-2.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/catalog-section.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/catalog-section-2.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/commerce.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/commerce-2.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/pages/commerce-3.css' %}?v={{ static_version }}">
  {# Без inline <style> від htmx — стилі індикаторів у components.css (CSP style-src) #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/nav.js' %}?v={{ static_version }}" defer></script>
  <script src="{% static 'js/header-search.js' %}?v={{ static_version }}" defer></script>
  <script src="{% static 'js/btn-glow.js' %}?v={{ static_version }}" defer></script>
  <script src="{% static 'js/custom-dropdown.js' %}?v={{ static_version }}" defer></script>
  <script src="{% static 'js/catalog-ui.js' %}?v={{ static_version }}" defer></script>
  <script src="{% static 'js/cart-feedback.js' %}?v={{ static_version }}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a class="visually-hidden" href="#main">Перейти до вмісту</a>
  {% include "partials/header.html" %}
  <main class="site-main" id="main">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  {% block extra_js %}{% endblock %}
</body>
</html>
