# HTTPS after certbot for soliron.com.ua.
# Enable via: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name soliron.com.ua www.soliron.com.ua 68.183.212.53 _;
    return 301 https://soliron.com.ua$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name soliron.com.ua www.soliron.com.ua 68.183.212.53 _;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/soliron.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soliron.com.ua/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # Короткі retry, поки web піднімається після recreate.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 20s;
    }
}
